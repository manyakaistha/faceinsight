losses:
  age: huber
  huber_delta: 5.0
  gender: bce_smooth
  label_smoothing: 0.05
  age_weight: 0.7
  gender_weight: 0.3

data:
  img_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  batch_size: 64
  num_workers: 4
  val_frac: 0.1
  augment: true
  randaug_n: 2
  randaug_m: 7

model:
  arch: resnet50
  lora_r: 12
  lora_alpha: 24.0
  lora_dropout: 0.0
  head_dropout: 0.2
  pretrained: true

training:
  epochs: 30
  base_lr: 5.0e-4
  min_lr: 1.0e-6
  weight_decay: 1.0e-4
  warmup_epochs: 2
  grad_clip: 1.0
  ema_decay: 0.9995
  early_stop_patience: 5
  early_stop_min_delta: 0.001
  save_dir: checkpoints/resnet50_lora
  top_k: 3
  seed: 42

inference:
  tta_flip: false
  face_expansion: 1.1
  face_detector_backend: mediapipe
  min_face_confidence: 0.5
  gender_threshold: 0.5
